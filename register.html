<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Surplus Food Rescue Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { forest: '#0F5229', forestHover: '#0A3B1D', mint: '#4CAF50', orange: '#E65C00', orangeHover: '#CC5200' }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F9FBF8; }
        .role-card.selected { border-color: #0F5229; background: #E8F5E9; box-shadow: 0 0 0 2px #0F5229; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-white border-b border-emerald-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="font-extrabold text-brand-forest">Surplus<span class="text-brand-orange">Food</span></a>
            <a href="login.html" class="text-sm font-semibold text-brand-forest">Already have account? Sign In</a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center py-10 px-4">
        <div class="w-full max-w-lg">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold">Create Account</h1>
                <p class="text-gray-500 text-sm mt-2">Join as Donor or Recipient</p>
            </div>
            <div class="bg-white rounded-3xl border border-emerald-100 shadow-lg p-8">
                <form onsubmit="handleRegister(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold uppercase mb-3">I want to register as</label>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="role-card cursor-pointer border-2 border-gray-200 rounded-2xl p-4 text-center" data-role="donor" onclick="selectRole('donor')">
                                <i class="fa-solid fa-hand-holding-heart text-brand-orange text-xl mb-2"></i>
                                <div class="text-sm font-bold">Donor</div>
                                <div class="text-[10px] text-gray-500">Business / Individual</div>
                            </div>
                            <div class="role-card cursor-pointer border-2 border-gray-200 rounded-2xl p-4 text-center" data-role="recipient" onclick="selectRole('recipient')">
                                <i class="fa-solid fa-house-chimney text-brand-forest text-xl mb-2"></i>
                                <div class="text-sm font-bold">Recipient</div>
                                <div class="text-[10px] text-gray-500">Shelter / NGO</div>
                            </div>
                        </div>
                        <input type="hidden" id="selectedRole">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold uppercase mb-1">Full Name</label>
                            <input type="text" id="fullName" required class="w-full px-4 py-2.5 bg-gray-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-brand-forest">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase mb-1">Organization</label>
                            <input type="text" id="orgName" class="w-full px-4 py-2.5 bg-gray-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-brand-forest">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase mb-1">Email</label>
                        <input type="email" id="email" required class="w-full px-4 py-2.5 bg-gray-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-brand-forest">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase mb-1">Phone</label>
                        <input type="tel" id="phone" required class="w-full px-4 py-2.5 bg-gray-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-brand-forest">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold uppercase mb-1">Password</label>
                            <input type="password" id="password" required minlength="6" class="w-full px-4 py-2.5 bg-gray-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-brand-forest">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase mb-1">Confirm Password</label>
                            <input type="password" id="confirmPassword" required class="w-full px-4 py-2.5 bg-gray-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-brand-forest">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase mb-1">City / Area</label>
                        <input type="text" id="city" required class="w-full px-4 py-2.5 bg-gray-50 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-brand-forest">
                    </div>
                    <button type="submit" class="w-full py-3.5 bg-brand-orange text-white font-bold rounded-xl text-sm hover:bg-brand-orangeHover">Create Account</button>
                </form>
                <p class="mt-6 text-center text-sm text-gray-500">Already registered? <a href="login.html" class="font-bold text-brand-forest">Sign In</a></p>
            </div>
        </div>
    </main>

    <script>
        let currentRole = null;
        function selectRole(role) {
            currentRole = role;
            document.getElementById('selectedRole').value = role;
            document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
            document.querySelector(`[data-role="${role}"]`).classList.add('selected');
        }
        function handleRegister(e) {
            e.preventDefault();
            if (!currentRole) { alert('Select a role'); return; }
            if (document.getElementById('password').value !== document.getElementById('confirmPassword').value) {
                alert('Passwords do not match'); return;
            }
            const user = {
                name: document.getElementById('fullName').value,
                org: document.getElementById('orgName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                city: document.getElementById('city').value,
                role: currentRole,
                loggedIn: true
            };
            localStorage.setItem('sfrn_user', JSON.stringify(user));
            location.href = currentRole === 'donor' ? 'dashboard-donor.html' : 'dashboard-recipient.html';
        }
    </script>
</body>
</html>
