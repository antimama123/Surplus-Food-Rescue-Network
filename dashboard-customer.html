<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard | Surplus Food Rescue Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              forest: '#0F5229', forestHover: '#0A3B1D', mint: '#4CAF50',
              orange: '#E65C00', orangeHover: '#CC5200'
            }
          },
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
        }
      }
    }
  </script>
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F9FBF8; } </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="bg-white border-b border-emerald-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="surplus food.html" class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-full bg-brand-forest text-white flex items-center justify-center font-bold text-sm">SFRN</div>
        <span class="font-extrabold text-brand-forest text-lg">Surplus<span class="text-brand-orange">Food</span></span>
      </a>
      <div class="flex items-center gap-4">
        <a href="surplus food.html" class="text-sm font-semibold text-gray-600 hover:text-brand-forest">Browse All Food</a>
        <a href="login.html" class="px-4 py-2 rounded-full border border-gray-200 text-xs font-bold text-gray-700 hover:bg-gray-50">Logout</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <div class="bg-emerald-900 text-white p-6 rounded-3xl mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-lg">
      <div>
        <h1 class="text-2xl font-extrabold">Welcome back, Recipient Portal</h1>
        <p class="text-emerald-200 text-sm mt-1">Claim surplus food from local donors to help your community.</p>
      </div>
    </div>

    <h2 class="text-xl font-extrabold text-gray-900 mb-6">Nearby Available Surplus Food</h2>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
      <div class="bg-white rounded-2xl border border-emerald-100 p-5 shadow-sm flex flex-col justify-between">
        <div>
          <h3 class="font-bold text-gray-900 text-base mb-1">Fresh Bakery Items & Breads</h3>
          <p class="text-xs text-gray-500 mb-3">Donor: Downtown Bakehouse</p>
          <div class="bg-gray-50 p-3 rounded-xl text-xs text-gray-600 mb-4">
            <strong>Quantity:</strong> 15 Packs
          </div>
        </div>
        <button class="w-full py-2.5 bg-brand-forest text-white text-xs font-bold rounded-xl hover:bg-brand-forestHover transition">
          Claim Food Package
        </button>
      </div>
    </div>
  </main>

</body>
</html>
