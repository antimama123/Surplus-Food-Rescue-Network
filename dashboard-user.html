<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donor Dashboard | Surplus Food Rescue Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              forest: '#0F5229', forestHover: '#0A3B1D', mint: '#4CAF50',
              orange: '#E65C00', orangeHover: '#CC5200'
            }
          },
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
        }
      }
    }
  </script>
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F9FBF8; } </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="bg-white border-b border-emerald-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="surplus food.html" class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-full bg-brand-forest text-white flex items-center justify-center font-bold text-sm">SFRN</div>
        <span class="font-extrabold text-brand-forest text-lg">Surplus<span class="text-brand-orange">Food</span></span>
      </a>
      <div class="flex items-center gap-4">
        <a href="surplus food.html" class="text-sm font-semibold text-gray-600 hover:text-brand-forest">Browse Main Site</a>
        <a href="login.html" class="px-4 py-2 rounded-full border border-gray-200 text-xs font-bold text-gray-700 hover:bg-gray-50">Logout</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-2xl font-extrabold text-gray-900">Donor Dashboard</h1>
        <p class="text-gray-500 text-sm">Manage your surplus food listings and pickup statuses.</p>
      </div>
      <a href="surplus food.html" class="px-5 py-2.5 rounded-full bg-brand-orange text-white font-bold text-xs shadow-md hover:bg-brand-orangeHover transition">
        + Post New Surplus Food
      </a>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-8">
      <div class="bg-white p-5 rounded-2xl border border-emerald-100 shadow-sm text-center">
        <div class="text-3xl font-extrabold text-brand-forest">18</div>
        <p class="text-xs text-gray-500 font-semibold mt-1 uppercase">Total Surplus Listings</p>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-emerald-100 shadow-sm text-center">
        <div class="text-3xl font-extrabold text-brand-orange">210 kg</div>
        <p class="text-xs text-gray-500 font-semibold mt-1 uppercase">Food Rescued</p>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-emerald-100 shadow-sm text-center">
        <div class="text-3xl font-extrabold text-emerald-600">3</div>
        <p class="text-xs text-gray-500 font-semibold mt-1 uppercase">Active Pickups Today</p>
      </div>
    </div>
  </main>

</body>
</html>
